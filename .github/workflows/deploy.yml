name: Deploy react

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and test React image
        run: |
          docker build -t marian/react-test -f Dockerfile.dev .
          docker run -e CI=true marian/react-test npm run test

      - name: Build microservices images
        run: |
          docker build -t marianghaly/multi-client ./microservices/client
          docker build -t marianghaly/multi-nginx ./microservices/nginx
          docker build -t marianghaly/multi-server ./microservices/server
          docker build -t marianghaly/multi-worker ./microservices/worker

      - name: Push microservices images
        run: |
          docker push marianghaly/multi-client
          docker push marianghaly/multi-nginx
          docker push marianghaly/multi-server
          docker push marianghaly/multi-worker