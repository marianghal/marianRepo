name: Deploy react
on:
  push:
    branches:
      - master 

jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - uses: action/checkout@v2
       - run : docker login -u ${{ secrets.DOCKER_USERNAME}} -P ${{ secrets.DOCKER_PASSWORD}}
       - run : docker build -t marian/react-test -f Dockerfile.dev .
       - run : docker run -e CLI=true marian/react-test npm run test

